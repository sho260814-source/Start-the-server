<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy-Server 起動パネル</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1e1f22;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #2b2d31;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      text-align: center;
      max-width: 420px;
      width: 90%;
    }
    h1 {
      margin-top: 0;
      font-size: 24px;
    }
    p {
      color: #b5bac1;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .address {
      background-color: #1e1f22;
      padding: 10px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 16px;
      color: #57f287;
      margin-bottom: 20px;
      user-select: all;
    }
    .warning {
      background-color: rgba(237, 66, 69, 0.15);
      border: 1px solid #ed4245;
      color: #ff8a8c;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      line-height: 1.5;
      margin-bottom: 25px;
    }
    .btn {
      background-color: #5865f2;
      color: white;
      border: none;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #4752c4;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎮 Happy-Server</h1>
    <div class="address">happy-server.falix.gg</div>
    <p>下のボタンを押すと外部の起動ページが開きます。<br>人間確認のチェックを入れて起動してください。</p>
    <div class="warning">
      ⚠️ 注意事項<br>
      怪しいので「Start the server」を押したら速やかにタブを消してください。
    </div>
    <button class="btn" onclick="startServer()">🚀 サーバーをスタート</button>
  </div>

  <script>
    function startServer() {
      const s = String.fromCharCode(47);
      const url = "https:" + s + s + "falixnodes.net" + s + "s" + s + "2xgcom9yi7sgx?lang=en";
      window.open(url, "_blank");
    }
  </script>
</body>
</html>
